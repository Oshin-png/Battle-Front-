<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BATTLEFRONT LAGOS - AK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial;touch-action:none}
canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;top:0;left:0;right:0;height:48px;background:#000;border-bottom:3px solid #0f0;color:#0f0;display:flex;justify-content:space-between;align-items:center;padding:0 10px;z-index:10;font-weight:900;font-size:16px}
#gun{position:fixed;bottom:-10px;left:50%;transform:translateX(-50%);width:280px;height:160px;z-index:9;background:linear-gradient(to top,#222,#555);clip-path:polygon(10% 100%,25% 45%,35% 25%,65% 25%,75% 45%,90% 100%);border-top:4px solid #999}
#fire{position:fixed;bottom:18px;right:14px;width:115px;height:115px;border-radius:50%;background:radial-gradient(#ff3333,#7a0000);border:4px solid #fff;color:#fff;font:900 22px Arial;z-index:11}
#joy{position:fixed;bottom:18px;left:14px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.5);z-index:11}
#joyc{position:absolute;top:32px;left:32px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.7)}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
