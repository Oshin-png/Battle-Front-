<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BATTLEFRONT LAGOS - COD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Impact,Arial;touch-action:none}
#c{width:100vw;height:100vh;display:block}
#hud{position:fixed;top:0;left:0;right:0;height:52px;background:linear-gradient(#111,#000);border-bottom:3px solid #ff0;color:#ff0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:10;font-weight:900}
#gun{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:320px;height:180px;background:linear-gradient(#444,#222);clip-path:polygon(20% 100%,30% 40%,40% 20%,60% 20%,70% 40%,80% 100%);z-index:9;box-shadow:0 0 20px #000}
#gun::after{content:'AK-47 | 30/90';position:absolute;top:-25px;left:50%;transform:translateX(-50%);color:#fff;font:12px Arial;background:#000c;padding:3px 8px;border-radius:4px}
#fire{position:fixed;bottom:22px;right:18px;width:118px;height:118px;border-radius:50%;background:radial-gradient(#ff2222,#8a0000);border:5px solid #fff;color:#fff;font:900 22px Arial;z-index:11;box-shadow:0 0 30px red}
#joy{position:fixed;bottom:22px;left:18px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.12);border:3px solid rgba(255,255,255,0.4);z-index:11}
#joyc{position:absolute;top:35px;left:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.6)}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;z-index:10}
#cross:before,#cross:after{content:'';position:absolute;background:rgba(255,255,0,0.9);box-shadow:0 0 4px #000}
#cross:before{width:2px;height:30px;left:14px}#cross:after{width:30px;height:2px;top:14px}
#hit{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,0,0,0.25);z-index:12;display:none;pointer-events:none}
</style></head><body>
<div id="hud"><span>🔫 BATTLEFRONT: LAGOS</span><span style="display:flex;gap:10px"><span id="hp" style="width:90px;height:10px;background:#333;border:1px solid #ff0"><div id="hpb" style="width:100%;height:100%;background:linear-gradient(lime,green)"></div></span><span>K:<b id="k">0</b></span></span></div>
<div id="cross"></div><div id="gun"></div><div id="hit"></div>
<button id="fire">FIRE</button><div id="joy"><div id="joyc"></div></div>
<canvas id="c"></canvas>
<script>
let C=document.getElementById('c'),X=C.getContext('2d');C.width=innerWidth;C.height=innerHeight;
let kills=0,bul=[],en=[],parts=[],playerHP=100,keys={},mx=0,my=0,jx=0,jy=0;
function snd(f){try{let a=new (window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.3,a.currentTime);g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+0.15);o.start();o.stop(a.currentTime+0.15);}catch(e){}}
for(let i=0;i<8;i++)spawn();
function spawn(){en.push({x:Math.random()*C.width,y:80+Math.random()*(C.height-200),hp:100,spd:0.8+Math.random()*1.5,name:'OPFOR_'+(Math.floor(Math.random()*900))})}
function loop(){
X.fillStyle='#1e3d1e';X.fillRect(0,0,C.width,C.height);
X.fillStyle='#c2b280';X.fillRect(0,C.height*0.65,C.width,C.height*0.35);
X.strokeStyle='#0003';X.lineWidth=2;for(let i=0;i<C.width;i+=60){X.beginPath();X.moveTo(i,C.height*0.65);X.lineTo(i-40,C.height);X.stroke()}
en.forEach(e=>{
  let ang=Math.atan2(C.height/2-e.y,C.width/2-e.x);e.x+=Math.cos(ang)*e.spd+jx;e.y+=Math.sin(ang)*e.spd+jy;
  let d=Math.hypot(e.x-C.width/2,e.y-C.height/2);
  if(d<90){playerHP-=0.4;document.getElementById('hit').style.display='block';setTimeout(()=>document.getElementById('hit').style.display='none',100);if(playerHP<=0){alert('YOU DIED! KILLS: '+kills);location.reload()}document.getElementById('hpb').style.width=playerHP+'%'}
  X.fillStyle=e.hp<35?'#ff0':'#d00';X.fillRect(e.x-18,e.y-18,36,44);X.fillStyle='#000';X.fillRect(e.x-14,e.y-10,28,4);
  X.fillStyle='#fc9';X.beginPath();X.arc(e.x,e.y-24,11,0,7);X.fill();X.fillStyle='#000';X.fillRect(e.x-16,e.y-28,14,3);
  X.fillStyle='#fff';X.font='900 9px Arial';X.fillText(e.name,e.x-24,e.y-42);
  X.fillStyle='#500';X.fillRect(e.x-16,e.y-48,32,5);X.fillStyle='lime';X.fillRect(e.x-16,e.y-48,32*e.hp/100,5);
});
bul.forEach((b,i)=>{b.x+=b.dx;b.y+=b.dy;b.life--;X.fillStyle='yellow';X.shadowColor='orange';X.shadowBlur=10;X.beginPath();X.arc(b.x,b.y,5,0,7);X.fill();X.shadowBlur=0;
 en.forEach((e,j)=>{if(Math.hypot(b.x-e.x,b.y-e.y)<26){e.hp-=38;bul.splice(i,1);parts.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:20,c:'red'});if(e.hp<=0){en.splice(j,1);kills++;document.getElementById('k').innerText=kills;parts.push({x:e.x,y:e.y,vx:0,vy:0,life:30,c:'blood'});spawn();if(kills>=25){alert('🔥 LAGOS SECURED! YOU ARE LEGEND! KILLS: '+kills);location.reload()}} }}) ; if(b.life<0)bul.splice(i,1);
});
parts.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;X.fillStyle=p.c==='blood'?'rgba(200,0,0,'+(p.life/30)+')':'red';if(p.c==='blood'){X.beginPath();X.arc(p.x,p.y,20*(1-p.life/30),0,7);X.fill()}else{X.fillRect(p.x,p.y,4,4)}if(p.life<0)parts.splice(i,1)});
requestAnimationFrame(loop);
}
function shoot(){
 let tx=C.width/2+(Math.random()-0.5)*20,ty=C.height/2+(Math.random()-0.5)*20;
 let ang=Math.atan2(ty-(C.height-60),tx-C.width/2);
 bul.push({x:C.width/2,y:C.height-60,dx:Math.cos(ang)*18,dy:Math.sin(ang)*18,life:60});
 C.style.transform='translate('+(Math.random()*6-3)+'px,'+(Math.random()*6-3)+'px)';setTimeout(()=>C.style.transform='',60);
 document.getElementById('gun').style.transform='translateX(-50%) translateY(10px)';setTimeout(()=>document.getElementById('gun').style.transform='translateX(-50%)',80);
 snd(180);if(navigator.vibrate)navigator.vibrate(40);
}
document.getElementById('fire').addEventListener('touchstart',e=>{e.preventDefault();shoot()});
document.getElementById('fire').onclick=shoot;
C.addEventListener('touchmove',e=>{let t=e.touches[0];mx=t.clientX-C.width/2;my=t.clientY-C.height/2},{passive:false});
let joy=document.getElementById('joy'),joyc=document.getElementById('joyc'),drag=false;
joy.addEventListener('touchstart',()=>drag=true);joy.addEventListener('touchend',()=>{drag=false;jx=0;jy=0;joyc.style.transform='translate(0,0)'});
joy.addEventListener('touchmove',e=>{if(!drag)return;let r=joy.getBoundingClientRect(),t=e.touches[0],dx=t.clientX-(r.left+60),dy=t.clientY-(r.top+60),d=Math.hypot(dx,dy);if(d>45){dx=dx/d*45;dy=dy/d*45}joyc.style.transform=`translate(${dx}px,${dy}px)`;jx=-dx*0.05;jy=-dy*0.05;e.preventDefault()},{passive:false});
loop();
</script></body></html>
